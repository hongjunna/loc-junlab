# 링크 미리보기 봇 (JS를 실행하지 않음) → 공유 링크는 백엔드가 노선 정보가 담긴 OG 태그를 내려줌
map $http_user_agent $is_preview_bot {
    default 0;
    ~*(kakaotalk-scrap|kakaostory-og-reader|facebookexternalhit|facebot|twitterbot|slackbot|slack-imgproxy|discordbot|telegrambot|whatsapp|linkedinbot|line-poker|naver|yeti|daum|applebot|googlebot|bingbot|skypeuripreview|iframely|embedly) 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API 는 백엔드 컨테이너로 프록시 (외부 Nginx 없이도 동작)
    location /api/ {
        proxy_pass http://backend:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 공유 링크: 봇이면 OG 미리보기 HTML, 사람이면 SPA
    location ~ ^/p/([A-Za-z0-9]+)/?$ {
        if ($is_preview_bot) {
            rewrite ^/p/([A-Za-z0-9]+)/?$ /api/og/p/$1 last;
        }
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # 빌드 산출물은 파일명에 해시가 있으므로 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 라우팅, index.html 은 캐시하지 않음 (배포 즉시 반영)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
