services:
  # MongoDB (데이터는 mongo-data 볼륨에 보관, 외부 포트는 열지 않음)
  mongo:
    image: mongo:7
    container_name: bus-mongo
    restart: unless-stopped
    # MONGO_INITDB_ROOT_USERNAME / MONGO_INITDB_ROOT_PASSWORD 를 사용 (처음 볼륨 생성 시에만 적용)
    env_file: ./backend/.env
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - bus-network

  # 백엔드 (Express)
  backend:
    build: ./backend
    container_name: bus-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - PORT=5678
    ports:
      # 외부 Nginx가 /api 를 이 포트로 프록시하는 기존 구성 호환
      - '5679:5678'
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5678/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - bus-network

  # 프론트엔드 (React + Nginx, /api 는 backend 로 프록시)
  frontend:
    build:
      context: ./frontend
      args:
        # 공유 미리보기 이미지·사이트맵에 쓰는 서비스 주소
        SITE_URL: ${SITE_URL:-https://location.sideplay.dev}
    container_name: bus-frontend
    restart: unless-stopped
    ports:
      - '5678:80'
    depends_on:
      - backend
    networks:
      - bus-network

volumes:
  mongo-data:

networks:
  bus-network:
    driver: bridge
